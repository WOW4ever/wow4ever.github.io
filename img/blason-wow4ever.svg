<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 320" width="300" height="320">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a93a6"/><stop offset=".3" stop-color="#323a4a"/><stop offset=".55" stop-color="#b9c0cc"/><stop offset=".75" stop-color="#3a4252"/><stop offset="1" stop-color="#1a1f29"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c3878"/><stop offset=".6" stop-color="#0f1f4a"/><stop offset="1" stop-color="#070d22"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".55" r=".5">
      <stop offset="0" stop-color="#6f97ff" stop-opacity=".35"/><stop offset="1" stop-color="#6f97ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx=".5" cy=".45" r=".65">
      <stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1d79a"/><stop offset=".5" stop-color="#c9a45c"/><stop offset="1" stop-color="#6f5020"/>
    </linearGradient>
    <linearGradient id="goldv" x1="0" y1="40" x2="0" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f1d79a"/><stop offset=".6" stop-color="#c9a45c"/><stop offset="1" stop-color="#7d5c22"/>
    </linearGradient>
    <linearGradient id="blood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c0262f"/><stop offset="1" stop-color="#4f0b10"/>
    </linearGradient>
  </defs>
  <!-- deux lances croisées derrière l'écu, bannières déchirées -->
